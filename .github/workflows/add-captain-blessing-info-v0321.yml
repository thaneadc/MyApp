name: Add Captain Blessing info v0.32.1

on:
  push:
    branches: ['ui/captain-blessing-info']
    paths:
      - 'scripts/add_captain_blessing_info.py'
      - '.github/workflows/add-captain-blessing-info-v0321.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captain-blessing-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Captain Blessing info patch
        run: python3 scripts/add_captain_blessing_info.py

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Core rules regression
        run: npm test

      - name: v0.32 Final rules regression
        run: node tests/rules-v032.mjs

      - name: AI Final strategy regression
        run: node tests/ai-zone3-final-v032.mjs

      - name: Captain Blessing info regression
        run: node tests/captain-blessing-info-v0321.mjs

      - name: Build production bundle
        run: npm run build

      - name: Verify built Captain Blessing info
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Sea Witch Blessing' dist/voyage-v014.js
          grep -q 'No active Blessing' dist/voyage-v014.js
          grep -q 'Fortune · reroll 1 non-Skull die' dist/voyage-v014.js

      - name: Commit Captain Blessing info
        shell: bash
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voyage-v014.js tests/captain-blessing-info-v0321.mjs
          if git diff --cached --quiet; then
            echo "Captain Blessing info already committed"
          else
            git commit -m "Show Blessing in Captain Information"
            git push origin HEAD:ui/captain-blessing-info
          fi
