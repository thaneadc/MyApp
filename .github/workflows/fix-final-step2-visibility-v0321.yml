name: Fix Final Step 2 visibility v0.32.1

on:
  push:
    branches: ['fix/final-step2-visibility']
    paths:
      - 'scripts/fix_final_step2_visibility_v0321.py'
      - '.github/workflows/fix-final-step2-visibility-v0321.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-final-step2-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Final Step 2 visibility patch
        run: python3 scripts/fix_final_step2_visibility_v0321.py

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Core rules regression
        run: npm test

      - name: v0.32 Final rules regression
        run: node tests/rules-v032.mjs

      - name: AI Final strategy regression
        run: node tests/ai-zone3-final-v032.mjs

      - name: Final two-step lifecycle regression
        run: node tests/final-two-step-lifecycle-v0321.mjs

      - name: AI Step 2 visibility regression
        run: node tests/ai-final-step2-visibility-v0321.mjs

      - name: Build production bundle
        run: npm run build

      - name: Verify built pacing guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aiDelayOverride=2300' dist/voyage-v014.js
          grep -q 'aiDelayOverride=1800' dist/voyage-v014.js

      - name: Commit Final Step 2 visibility fix
        shell: bash
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voyage-v014.js tests/final-two-step-lifecycle-v0321.mjs tests/ai-final-step2-visibility-v0321.mjs
          if git diff --cached --quiet; then
            echo "Final Step 2 visibility fix already committed"
          else
            git commit -m "Keep AI Final Step 2 visible before victory"
            git push origin HEAD:fix/final-step2-visibility
          fi
