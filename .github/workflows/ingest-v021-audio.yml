name: Probe v0.21 Audio Shares

on:
  push:
    branches: ['release/v0.21']
    paths: ['.github/workflows/ingest-v021-audio.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe download client
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://firestorage.ai/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          resp=urllib.request.urlopen(req,timeout=30)
          data=resp.read()
          print('status',resp.status,'final',resp.url,'type',resp.headers.get('content-type'),'bytes',len(data))
          print(data.decode('utf-8','ignore'))
          PY
