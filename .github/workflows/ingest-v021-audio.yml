name: Ingest v0.21 Audio

on:
  push:
    branches: ['release/v0.21']
    paths: ['.github/workflows/ingest-v021-audio.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original uploaded soundtracks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import json, urllib.request, pathlib
          API='https://api.firestorage.ai/dev/file'
          jobs=[
            ('LsoSboH9Quaj','assets/captains-dash-adventure-v2.ogg'),
            ('RZaEYAq81iZV','assets/captains-dash-adrenaline-v2.ogg'),
          ]
          for share,out in jobs:
              req=urllib.request.Request(f'{API}/shares/{share}/files?maxResults=1000',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  meta=json.load(r)
              files=meta.get('files') or []
              if not files:
                  raise SystemExit(f'No files found in share {share}')
              fid=files[0]['fileId']
              req=urllib.request.Request(f'{API}/shares/{share}/files/{fid}/download',method='POST',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  dl=json.load(r)['downloadUrl']
              req=urllib.request.Request(dl,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=120).read()
              if not data.startswith(b'OggS'):
                  raise SystemExit(f'{out} is not OGG audio')
              pathlib.Path(out).write_bytes(data)
              print(out,len(data),files[0].get('fileName'))
          PY
          test $(wc -c < assets/captains-dash-adventure-v2.ogg) -gt 1000000
          test $(wc -c < assets/captains-dash-adrenaline-v2.ogg) -gt 900000

      - name: Commit soundtrack assets
        shell: bash
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/captains-dash-adventure-v2.ogg assets/captains-dash-adrenaline-v2.ogg
          if git diff --cached --quiet; then
            echo "Audio assets already present"
          else
            git commit -m "Add Adventure v2 and Final Mission Adrenaline v2 soundtracks"
            git push origin HEAD:release/v0.21
          fi
