name: Probe v0.21 Audio Shares

on:
  push:
    branches: ['release/v0.21']
    paths: ['.github/workflows/ingest-v021-audio.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe share pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          for name,url in [
            ('adventure','https://firestorage.ai/ja/f/LsoSboH9Quaj'),
            ('adrenaline','https://firestorage.ai/ja/f/RZaEYAq81iZV')]:
            print('\n===',name,'===')
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
            print('bytes',len(text))
            # Next/RSC data is embedded in scripts. Print useful string fragments only.
            seen=set()
            for pat in [r'https?[^"\\<> ]+',r'[^"\\<> ]+\.ogg[^"\\<> ]*',r'[^"\\<> ]*(?:download|api|files)[^"\\<> ]*']:
              for m in re.findall(pat,text,re.I):
                m=html.unescape(m)
                if 5 < len(m) < 900 and m not in seen:
                  seen.add(m); print(m)
            for key in ['Captains_Dash','file_id','public_id','downloadUrl','download_url','signed','mime_type','size_bytes']:
              pos=text.find(key)
              if pos>=0: print('CTX',key, text[max(0,pos-500):pos+1200])
          PY
