name: Probe v0.21 Audio Shares

on:
  push:
    branches: ['release/v0.21']
    paths: ['.github/workflows/ingest-v021-audio.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe download client
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          base='https://firestorage.ai'
          chunk=base+'/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          req=urllib.request.Request(chunk,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          print('chunk bytes',len(text))
          for pat in [r'[^"\']{0,140}/api/[^"\']{0,240}',r'[^"\']{0,160}download[^"\']{0,260}',r'[^"\']{0,160}share[^"\']{0,260}']:
            for m in re.findall(pat,text,re.I): print('MATCH',m[:900])
          for key in ['fetch(','axios','download','publicId','shareId','token','signedUrl']:
            start=0
            while True:
              pos=text.find(key,start)
              if pos<0: break
              print('CTX',key,text[max(0,pos-350):pos+900])
              start=pos+len(key)
          PY
