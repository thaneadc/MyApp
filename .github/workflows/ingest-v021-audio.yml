name: Probe v0.21 Audio Shares

on:
  push:
    branches: ['release/v0.21']
    paths: ['.github/workflows/ingest-v021-audio.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe download client
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re
          base='https://firestorage.ai/_next/static/chunks/'
          chunks=['4899-d89df949f2dbd5af.js','8441-REPLACE.js','8500-f4d7bfbe7500f274.js','8437-d65cc193dc908afa.js','5841-1160578ba9bb4f3e.js']
          for chunk in chunks:
            if 'REPLACE' in chunk: continue
            try:
              req=urllib.request.Request(base+chunk,headers={'User-Agent':'Mozilla/5.0'})
              text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
            except Exception as e:
              print('ERR',chunk,e); continue
            print('\n===',chunk,'bytes',len(text),'===')
            for key in ['/api/','download','presign','signed','publicId','shareId','fileId','storage','fetch(']:
              start=0; shown=0
              while shown<8:
                pos=text.lower().find(key.lower(),start)
                if pos<0: break
                print('CTX',key,text[max(0,pos-350):pos+900])
                start=pos+len(key); shown+=1
          PY
