name: Build Captain's Dash v0.17

on:
  push:
    branches:
      - 'release/v0.17'
    paths:
      - '.github/workflows/release-v017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v017:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.17 patch
        run: python3 scripts/release_v017.py

      - name: Set package version
        run: npm version 0.17.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Run rules regression tests
        run: npm test

      - name: Build release
        run: npm run build

      - name: Verify built v0.17 markers
        run: |
          grep -q "v0.17 TEST" dist/index.html
          grep -q "state.turn>0" dist/voyage-v014.js
          grep -q "deckShelf" dist/voyage-v014.js
          grep -q "grid-area:1/4/2/5" dist/voyage-table.css
          echo "v0.17 release build verified"

      - name: Commit v0.17 implementation
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add menu.js voyage-v014.js voyage-table.css index.html package.json package-lock.json
          if git diff --cached --quiet; then
            echo "v0.17 files already up to date"
          else
            git commit -m "Release v0.17 multi-AI, revised board layout and AI turn animation"
            git push origin HEAD:release/v0.17
          fi
