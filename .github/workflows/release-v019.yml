name: Build Captain's Dash v0.19

on:
  push:
    branches:
      - 'release/v0.19'
    paths:
      - '.github/workflows/release-v019.yml'
      - 'scripts/release_v019.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v019:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.19 patch
        run: python3 scripts/release_v019.py

      - name: Set package version
        run: npm version 0.19.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Run rules regression tests
        run: npm test

      - name: Build release
        run: npm run build

      - name: Verify v0.19 production bundle
        run: |
          grep -q "v0.19 TEST" dist/index.html
          grep -q "Missions Hidden" dist/voyage-v014.js
          grep -q "open?stacks.map" dist/voyage-v014.js
          grep -q "zoneLocked .missionTile{display:none" dist/voyage-table.css
          echo "v0.19 locked-zone concealment verified"

      - name: Commit v0.19 implementation
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voyage-v014.js voyage-table.css index.html menu.js package.json package-lock.json
          if git diff --cached --quiet; then
            echo "v0.19 files already up to date"
          else
            git commit -m "Release v0.19 hide mission cards in locked zones"
            git push origin HEAD:release/v0.19
          fi
