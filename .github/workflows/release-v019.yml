name: Build Captain's Dash v0.19

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v019:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.19 patch
        run: python3 scripts/release_v019.py

      - name: Set package version
        run: npm version 0.19.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Run rules regression tests
        run: npm test

      - name: Build release
        run: npm run build

      - name: Verify v0.19 production bundle
        run: |
          grep -q "v0.19 TEST" dist/index.html
          grep -q "missionCardBack" dist/voyage-v014.js
          grep -q "dockSelectable" dist/voyage-v014.js
          grep -q "Choose a glowing Mission card on the board" dist/voyage-v014.js
          grep -q "dockMissionGlow" dist/voyage-table.css
          echo "v0.19 dock selection and locked-zone card backs verified"
