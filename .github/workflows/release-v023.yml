name: Build Captain's Dash v0.23

on:
  push:
    branches:
      - 'release/v0.23'
    paths:
      - '.github/workflows/release-v023.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v023:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.23 patch
        run: python3 scripts/release_v023.py

      - name: Set package version
        run: npm version 0.23.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Run existing regression tests
        run: npm test

      - name: Run v0.22 regression tests
        run: node tests/rules-v022.mjs

      - name: Run v0.23 regression tests
        run: node tests/rules-v023.mjs

      - name: Build release
        run: npm run build

      - name: Verify built v0.23 markers
        shell: bash
        run: |
          grep -q "v0.23 Test" dist/index.html
          grep -q "The Final Isle · v0.23" dist/voyage-v014.js
          grep -q "quartersReadyAll" dist/voyage-v014.js
          grep -q "prepExpeditionLayout" dist/voyage-v014.js
          grep -q "binocularLens" dist/voyage-v014.js
          grep -q "helmHandle" dist/voyage-v014.js
          grep -q "for(const c of p.crew)c.exhausted=false" dist/engine-v014.mjs
          echo "v0.23 release build verified"

      - name: Commit v0.23 implementation
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine-v014.mjs voyage-v014.js voyage-table.css menu.js index.html package.json package-lock.json
          if git diff --cached --quiet; then
            echo "v0.23 files already up to date"
          else
            git commit -m "Release v0.23 expedition layout, ready-all quarters and refined icons"
            git push origin HEAD:release/v0.23
          fi
