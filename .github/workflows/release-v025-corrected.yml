name: Build Captain's Dash v0.25 Corrected

on:
  push:
    branches:
      - 'release/v0.25'
    paths:
      - '.github/workflows/release-v025-corrected.yml'

permissions:
  contents: write

jobs:
  build-v025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.25 patch
        run: |
          python3 scripts/release_v025.py
          python3 scripts/fix_v025_syntax.py
      - name: Set package version
        run: npm version 0.25.0 --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm ci
      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check voyage-v014.js
          node --check engine-v014.mjs
      - name: Run all regression tests
        run: |
          npm test
          node tests/rules-v022.mjs
          node tests/rules-v023.mjs
          node tests/rules-v024.mjs
          node tests/rules-v025.mjs
      - name: Build release
        run: npm run build
      - name: Verify v0.25 output
        run: |
          grep -q "v0.25" dist/index.html
          grep -q "portraitOptions" dist/menu.js
          grep -q "aiDelayOverride=2200" dist/voyage-v014.js
          grep -q "portrait:setup.portraits" dist/engine-v014.mjs
          test -f dist/assets/captain-alt-01.svg
          test -f dist/assets/captain-alt-06.svg
      - name: Commit v0.25 implementation
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine-v014.mjs voyage-v014.js menu.js index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v0.25 AI Crew Quarters fix and captain portrait picker"
            git push origin HEAD:release/v0.25
          fi
