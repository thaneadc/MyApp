name: Release Captain's Dash v0.31

on:
  push:
    branches: ['main']
    paths:
      - 'scripts/release_v031.py'
      - '.github/workflows/release-v031.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v031:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.31 balance patch
        run: python3 scripts/release_v031.py

      - name: Set package version
        run: npm version 0.31.0 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check menu.js
          node --check cards-v014.js
          node --check voyage-v014.js
          node --check engine-v014.mjs

      - name: Core rules regression
        run: npm test

      - name: Preserve AI late-game regression
        run: node tests/ai-zone3-final-v0301.mjs

      - name: v0.31 balance regression
        run: node tests/rules-v031.mjs

      - name: Build production bundle
        run: npm run build

      - name: Verify built v0.31 output
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v0.31' dist/index.html
          grep -q 'SKULL / 0 / 0 / 1 / 1 / 2 / 2 / GOLD' dist/index.html
          grep -q '"version": "0.31 Master Rules"' dist/cards-v014.js
          grep -q '"cost": 7' dist/cards-v014.js
          grep -q '"target": 16' dist/cards-v014.js
          grep -q "FACES=\['SKULL',0,0,1,1,2,2,'GOLD'\]" dist/engine-v014.mjs

      - name: Commit v0.31 implementation
        shell: bash
        run: |
          git config user.name "captains-dash-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards-v014.js engine-v014.mjs voyage-v014.js menu.js index.html tests/rules-v031.mjs package.json package-lock.json
          if git diff --cached --quiet; then
            echo "v0.31 implementation already committed"
          else
            git commit -m "Release v0.31 card and dice balance"
            git push origin HEAD:main
          fi
