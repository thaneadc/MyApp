name: Smoke Test Captain's Dash v0.22 Production

on:
  push:
    branches: ['release/v0.22']
    paths: ['.github/workflows/smoke-production-v022.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves v0.22
        shell: bash
        run: |
          set -euo pipefail
          base="https://captains-dash-the-final-isle.vercel.app"
          ok=0
          for attempt in $(seq 1 15); do
            echo "Production smoke attempt $attempt"
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 25 "$base/" || true)
            if [ "$code" = "200" ] && grep -q "v0.22 Test" /tmp/page.html; then
              curl -L -fsS --max-time 30 "$base/engine-v014.mjs" -o /tmp/engine.mjs
              curl -L -fsS --max-time 30 "$base/voyage-v014.js" -o /tmp/voyage.js
              curl -L -fsS --max-time 30 "$base/voyage-table.css" -o /tmp/table.css
              grep -q "FACES=\['SKULL',0,0,1,1,2,2,'GOLD'\]" /tmp/engine.mjs
              grep -q "playerZoneEligible" /tmp/engine.mjs
              grep -q "The Final Isle · v0.22" /tmp/voyage.js
              grep -q "completedMissionCard" /tmp/voyage.js
              grep -q "sailingIcon" /tmp/voyage.js
              grep -q "searchIcon" /tmp/voyage.js
              grep -q "die.d8" /tmp/table.css
              echo "PRODUCTION_V022_OK HTTP 200"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
