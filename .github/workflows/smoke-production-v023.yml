name: Smoke Test Captain's Dash v0.23 Production

on:
  push:
    branches: ['release/v0.23']
    paths: ['.github/workflows/smoke-production-v023.yml']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves v0.23
        shell: bash
        run: |
          set -euo pipefail
          base="https://captains-dash-the-final-isle.vercel.app"
          ok=0
          for attempt in $(seq 1 15); do
            echo "Production smoke attempt $attempt"
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' --max-time 25 "$base/" || true)
            if [ "$code" = "200" ] && grep -q "v0.23 Test" /tmp/page.html; then
              curl -L -sS --max-time 25 "$base/voyage-v014.js" -o /tmp/voyage.js
              curl -L -sS --max-time 25 "$base/voyage-table.css" -o /tmp/voyage.css
              curl -L -sS --max-time 25 "$base/engine-v014.mjs" -o /tmp/engine.mjs
              grep -q "quartersReadyAll" /tmp/voyage.js
              grep -q "prepExpeditionLayout" /tmp/voyage.js
              grep -q "binocularLens" /tmp/voyage.js
              grep -q "helmHandle" /tmp/voyage.js
              grep -q "for(const c of p.crew)c.exhausted=false" /tmp/engine.mjs
              grep -q "v0.23 — readable Expedition cards" /tmp/voyage.css
              echo "PRODUCTION_V023_OK"
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" = "1"
